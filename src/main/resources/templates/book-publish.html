<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>发布商品 - 校园二手书</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .section-title { border-left: 4px solid #667eea; padding-left: 10px; margin-bottom: 16px; font-weight: 600; }
        .condition-opt { display: inline-block; padding: 4px 12px; margin: 2px; border: 1px solid #dee2e6;
                         border-radius: 16px; cursor: pointer; user-select: none; }
        .condition-opt.active { background: #667eea; color: #fff; border-color: #667eea; }
    </style>
</head>
<body>

<!-- 顶部导航 -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">📚 校园二手书</a>
        <a class="nav-link" th:href="@{/book}">← 返回商品列表</a>
    </div>
</nav>

<div class="container py-4" style="max-width:720px;">
    <h3 class="mb-4">📝 发布二手书</h3>

    <form id="publishForm" novalidate>

        <h6 class="section-title">基本信息</h6>
        <div class="row g-3 mb-4">
            <div class="col-12">
                <label class="form-label">书名 <span class="text-danger">*</span></label>
                <input type="text" name="title" class="form-control" required maxlength="100">
            </div>
            <div class="col-md-6">
                <label class="form-label">作者</label>
                <input type="text" name="author" class="form-control" maxlength="100">
            </div>
            <div class="col-md-6">
                <label class="form-label">出版社</label>
                <input type="text" name="publisher" class="form-control" maxlength="100">
            </div>
            <div class="col-md-6">
                <label class="form-label">ISBN</label>
                <input type="text" name="isbn" class="form-control" maxlength="20">
            </div>
            <div class="col-md-6">
                <label class="form-label">分类</label>
                <select name="categoryId" class="form-select">
                    <option value="">请选择分类</option>
                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                </select>
            </div>
        </div>

        <h6 class="section-title">价格与成色</h6>
        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <label class="form-label">售价（元）<span class="text-danger">*</span></label>
                <input type="number" name="price" class="form-control" step="0.01" min="0" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">原价（元）</label>
                <input type="number" name="originalPrice" class="form-control" step="0.01" min="0">
            </div>
            <div class="col-12">
                <label class="form-label">成色</label><br>
                <span class="condition-opt" data-val="全新">全新</span>
                <span class="condition-opt" data-val="九成新">九成新</span>
                <span class="condition-opt" data-val="八成新">八成新</span>
                <span class="condition-opt" data-val="七成新及以下">七成新及以下</span>
                <input type="hidden" name="condition" id="conditionInput">
            </div>
        </div>

        <h6 class="section-title">其他</h6>
        <div class="row g-3 mb-4">
            <div class="col-12">
                <label class="form-label">封面图 URL</label>
                <input type="text" name="coverImage" class="form-control" placeholder="粘贴图片链接（可留空使用占位图）">
            </div>
            <div class="col-12">
                <label class="form-label">商品描述</label>
                <textarea name="description" class="form-control" rows="4"
                          placeholder="请简要描述书籍的新旧程度、是否有笔记、购买时间等"></textarea>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="button" onclick="submitForm()" class="btn btn-primary btn-lg flex-grow-1">发布商品</button>
            <a th:href="@{/book}" class="btn btn-outline-secondary btn-lg">取消</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // 成色选择交互
    document.querySelectorAll('.condition-opt').forEach(opt => {
        opt.onclick = () => {
            document.querySelectorAll('.condition-opt').forEach(o => o.classList.remove('active'));
            opt.classList.add('active');
            document.getElementById('conditionInput').value = opt.dataset.val;
        };
    });

    async function submitForm() {
        const form = document.getElementById('publishForm');
        // 原生 HTML5 校验
        if (!form.checkValidity()) { form.reportValidity(); return; }

        const fd = new FormData(form);
        const body = {};
        fd.forEach((v, k) => { if (v !== '') body[k] = v; });
        // 数字类型转换
        if (body.price)         body.price         = Number(body.price);
        if (body.originalPrice) body.originalPrice = Number(body.originalPrice);
        if (body.categoryId)    body.categoryId    = Number(body.categoryId);

        try {
            const resp = await fetch('/api/book/publish', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
                credentials: 'same-origin'
            });
            const json = await resp.json();
            if (json.code === 200) {
                alert('🎉 发布成功！即将跳转到商品详情页');
                location.href = '/book/detail/' + json.data.id;
            } else {
                alert('发布失败：' + json.message);
            }
        } catch (e) {
            alert('网络错误：' + e.message);
        }
    }
</script>
</body>
</html>
