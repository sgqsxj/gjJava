<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园二手书交易管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <div class="jumbotron text-center">
            <h1 class="display-4">校园二手书交易管理系统</h1>
            <p class="lead">Spring Boot 2.7 + MyBatis + Thymeleaf + MySQL</p>
            <hr class="my-4">
            <p>项目骨架已成功启动，后续模块将逐步开发。</p>
            <a class="btn btn-primary btn-lg" href="#" role="button">开始使用</a>
        </div>
        <div class="row mt-4">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">核心功能</h5>
                        <p class="card-text">用户注册登录、商品搜索浏览、下单交易、订单状态流转、个人中心</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">次要功能</h5>
                        <p class="card-text">收藏功能</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">技术栈</h5>
                        <p class="card-text">Spring Boot 2.7 + MyBatis + MySQL + Thymeleaf + Bootstrap</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
