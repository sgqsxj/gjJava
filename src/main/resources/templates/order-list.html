<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的订单 - 校园二手</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .navbar-brand { font-weight: 700; }
        .order-card { border: 1px solid #eee; border-radius: 8px; margin-bottom: 14px; }
        .order-head { background: #f8f9fa; padding: 10px 16px; border-radius: 8px 8px 0 0;
                      font-size: 13px; color: #666; }
        .order-body { padding: 16px; }
        .amount { color: #e4393c; font-weight: 700; font-size: 18px; }
        .status-badge { font-size: 13px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">🛒 校园二手</a>
        <a class="nav-link" th:href="@{/book}">商品</a>
        <a class="nav-link active" th:href="@{/order}">我的订单</a>
        <div class="ms-auto">
            <span class="text-muted me-2" th:if="${currentUser != null}">
                👋 <span th:text="${currentUser.nickname}"></span>
            </span>
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/}">返回首页</a>
        </div>
    </div>
</nav>

<div class="container py-4" style="max-width:960px;">
    <h4 class="mb-3">📦 我的订单</h4>

    <!-- 角色切换 -->
    <ul class="nav nav-pills mb-3" id="roleTabs">
        <li class="nav-item">
            <a class="nav-link active" href="javascript:void(0)" data-role="buy" onclick="switchRole('buy')">我买到的</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="javascript:void(0)" data-role="sell" onclick="switchRole('sell')">我卖出的</a>
        </li>
    </ul>

    <!-- 状态筛选 -->
    <ul class="nav nav-tabs mb-3" id="statusTabs">
        <li class="nav-item"><a class="nav-link active" href="javascript:void(0)" data-status="" onclick="switchStatus('')">全部</a></li>
        <li class="nav-item"><a class="nav-link" href="javascript:void(0)" data-status="PENDING_PAYMENT" onclick="switchStatus('PENDING_PAYMENT')">待支付</a></li>
        <li class="nav-item"><a class="nav-link" href="javascript:void(0)" data-status="PAID" onclick="switchStatus('PAID')">待发货</a></li>
        <li class="nav-item"><a class="nav-link" href="javascript:void(0)" data-status="SHIPPED" onclick="switchStatus('SHIPPED')">待收货</a></li>
        <li class="nav-item"><a class="nav-link" href="javascript:void(0)" data-status="COMPLETED" onclick="switchStatus('COMPLETED')">已完成</a></li>
        <li class="nav-item"><a class="nav-link" href="javascript:void(0)" data-status="CANCELLED" onclick="switchStatus('CANCELLED')">已取消</a></li>
    </ul>

    <div id="orderList"></div>

    <div id="emptyTip" class="text-center text-muted py-5" style="display:none;">
        <h5>还没有相关订单</h5>
        <a class="btn btn-primary btn-sm mt-2" th:href="@{/book}">去逛逛</a>
    </div>

    <nav id="pagination" class="mt-3" style="display:none;">
        <ul class="pagination justify-content-center" id="pageNav"></ul>
    </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let role = 'buy';
    let statusFilter = '';
    let currentPage = 1;
    const pageSize = 5;

    window.onload = () => loadOrders(1);

    function switchRole(r) {
        role = r;
        document.querySelectorAll('#roleTabs .nav-link').forEach(a =>
            a.classList.toggle('active', a.dataset.role === r));
        loadOrders(1);
    }

    function switchStatus(s) {
        statusFilter = s;
        document.querySelectorAll('#statusTabs .nav-link').forEach(a =>
            a.classList.toggle('active', a.dataset.status === s));
        loadOrders(1);
    }

    async function loadOrders(pageNum) {
        currentPage = pageNum;
        const params = new URLSearchParams({ role, pageNum, pageSize });
        if (statusFilter) params.append('status', statusFilter);

        try {
            const resp = await fetch('/api/order/list?' + params.toString());
            const json = await resp.json();
            if (json.code === 401) { location.href = '/login?redirect=/order'; return; }
            if (json.code !== 200) { alert(json.message); return; }
            render(json.data);
        } catch (e) {
            alert('请求失败：' + e.message);
        }
    }

    function render(page) {
        const list = page.list || [];
        const box = document.getElementById('orderList');
        const empty = document.getElementById('emptyTip');
        box.innerHTML = '';

        if (list.length === 0) {
            empty.style.display = 'block';
            document.getElementById('pagination').style.display = 'none';
            return;
        }
        empty.style.display = 'none';

        list.forEach(o => {
            const actions = buildActions(o);
            const badgeClass = {
                PENDING_PAYMENT: 'bg-warning text-dark',
                PAID: 'bg-info text-dark',
                SHIPPED: 'bg-primary',
                COMPLETED: 'bg-success',
                CANCELLED: 'bg-secondary'
            }[o.status] || 'bg-secondary';

            box.innerHTML += `
                <div class="order-card">
                    <div class="order-head d-flex justify-content-between">
                        <span>订单号：${o.orderNo}　下单时间：${(o.createTime || '').replace('T', ' ').slice(0, 19)}</span>
                        <span class="badge ${badgeClass} status-badge">${o.statusLabel || o.status}</span>
                    </div>
                    <div class="order-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="mb-1">${o.bookTitle}</h6>
                                <div class="text-muted small">
                                    单价 ¥${o.bookPrice} × ${o.quantity}
                                    ${role === 'buy' ? '　卖家：' + (o.sellerName || '') : '　买家：' + (o.buyerName || '')}
                                </div>
                                <div class="text-muted small">收货地址：${o.address || '未填写'}</div>
                            </div>
                            <div class="text-end">
                                <div class="amount">¥${o.totalAmount}</div>
                                <div class="mt-2 d-flex gap-2 justify-content-end">${actions}</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });
        renderPagination(page);
    }

    /**
     * 按角色 + 状态渲染可用操作按钮（与后端状态机保持一致）
     */
    function buildActions(o) {
        const btns = [];
        if (role === 'buy') {
            if (o.status === 'PENDING_PAYMENT') {
                btns.push(`<button class="btn btn-sm btn-danger" onclick="doAction(${o.id},'pay','确认支付该订单？')">去支付</button>`);
                btns.push(`<button class="btn btn-sm btn-outline-secondary" onclick="doAction(${o.id},'cancel','确认取消订单？库存将回补')">取消订单</button>`);
            } else if (o.status === 'SHIPPED') {
                btns.push(`<button class="btn btn-sm btn-success" onclick="doAction(${o.id},'confirm','确认已收到货？')">确认收货</button>`);
            }
        } else {
            if (o.status === 'PAID') {
                btns.push(`<button class="btn btn-sm btn-primary" onclick="doAction(${o.id},'ship','确认已发货？')">去发货</button>`);
            }
        }
        return btns.join('');
    }

    async function doAction(orderId, action, confirmMsg) {
        if (!confirm(confirmMsg)) return;
        try {
            const resp = await fetch(`/api/order/${orderId}/${action}`, {
                method: 'POST',
                credentials: 'same-origin'
            });
            const json = await resp.json();
            if (json.code === 200) {
                alert('操作成功');
                loadOrders(currentPage);
            } else {
                alert('操作失败：' + json.message);
            }
        } catch (e) {
            alert('网络错误：' + e.message);
        }
    }

    function renderPagination(page) {
        const pages = page.pages || 1;
        const navEl = document.getElementById('pagination');
        const ul = document.getElementById('pageNav');
        navEl.style.display = pages > 1 ? 'block' : 'none';
        ul.innerHTML = '';
        for (let i = 1; i <= pages; i++) {
            const li = document.createElement('li');
            li.className = 'page-item' + (i === currentPage ? ' active' : '');
            li.innerHTML = `<a class="page-link" href="javascript:void(0)" onclick="loadOrders(${i})">${i}</a>`;
            ul.appendChild(li);
        }
    }
</script>
</body>
</html>
