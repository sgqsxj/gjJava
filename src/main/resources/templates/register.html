<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 - 校园二手书交易管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .reg-card { max-width: 450px; margin: 60px auto; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .reg-header { text-align: center; padding: 25px 20px 5px; }
        .reg-header h3 { font-weight: 600; color: #333; }
        .reg-header p { color: #888; font-size: 14px; }
        .reg-body { padding: 15px 40px 35px; }
        .form-group { margin-bottom: 15px; }
        .btn-register { width: 100%; padding: 10px; font-size: 16px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; }
        .btn-register:hover { opacity: 0.9; }
        .reg-footer { text-align: center; margin-top: 12px; font-size: 14px; color: #888; }
        .reg-footer a { text-decoration: none; color: #667eea; font-weight: 500; }
        .reg-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card reg-card">
            <div class="reg-header">
                <h3>用户注册</h3>
                <p>加入校园二手书交易系统</p>
            </div>
            <div class="reg-body">
                <form id="registerForm" onsubmit="return doRegister()">
                    <div class="form-group">
                        <label class="form-label">用户名 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="username" name="username"
                               placeholder="3-50 位" required minlength="3" maxlength="50">
                    </div>
                    <div class="form-group">
                        <label class="form-label">密码 <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="6-50 位" required minlength="6" maxlength="50">
                    </div>
                    <div class="form-group">
                        <label class="form-label">确认密码 <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                               placeholder="再次输入密码" required minlength="6" maxlength="50">
                    </div>
                    <div class="form-group">
                        <label class="form-label">昵称</label>
                        <input type="text" class="form-control" id="nickname" name="nickname"
                               placeholder="选填，默认同用户名" maxlength="50">
                    </div>
                    <div class="form-group">
                        <label class="form-label">手机号</label>
                        <input type="text" class="form-control" id="phone" name="phone"
                               placeholder="选填" maxlength="20">
                    </div>
                    <button type="submit" class="btn btn-primary btn-register">注 册</button>
                </form>
                <div class="reg-footer">
                    已有账号？<a th:href="@{/login}">立即登录</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function doRegister() {
            const data = {
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value,
                confirmPassword: document.getElementById('confirmPassword').value,
                nickname: document.getElementById('nickname').value.trim(),
                phone: document.getElementById('phone').value.trim()
            };
            if (!data.username || !data.password || !data.confirmPassword) {
                alert('请填写必填项');
                return false;
            }
            if (data.password !== data.confirmPassword) {
                alert('两次密码不一致');
                return false;
            }
            fetch('/api/user/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify(data)
            })
            .then(r => r.json())
            .then(res => {
                if (res.code === 200) {
                    alert('注册成功，请登录');
                    location.href = '/login';
                } else {
                    alert(res.message || '注册失败');
                }
            })
            .catch(err => alert('网络错误：' + err));
            return false;
        }
    </script>
</body>
</html>
