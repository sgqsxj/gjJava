<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录 - 校园二手书交易管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .login-card { max-width: 420px; margin: 80px auto; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .login-header { text-align: center; padding: 30px 20px 10px; }
        .login-header h3 { font-weight: 600; color: #333; }
        .login-header p { color: #888; font-size: 14px; }
        .login-body { padding: 20px 40px 40px; }
        .form-group { margin-bottom: 18px; }
        .btn-login { width: 100%; padding: 10px; font-size: 16px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; }
        .btn-login:hover { opacity: 0.9; }
        .login-footer { text-align: center; margin-top: 15px; font-size: 14px; color: #888; }
        .login-footer a { text-decoration: none; color: #667eea; font-weight: 500; }
        .login-footer a:hover { text-decoration: underline; }
        .alert { text-align: center; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card login-card">
            <div class="login-header">
                <h3>校园二手书交易系统</h3>
                <p>用户登录</p>
            </div>
            <div class="login-body">
                <!-- 错误提示 -->
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>

                <form id="loginForm" onsubmit="return doLogin()">
                    <div class="form-group">
                        <label class="form-label">用户名</label>
                        <input type="text" class="form-control" id="username" name="username"
                               placeholder="请输入用户名" required maxlength="50">
                    </div>
                    <div class="form-group">
                        <label class="form-label">密码</label>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="请输入密码" required maxlength="50">
                    </div>
                    <button type="submit" class="btn btn-primary btn-login">登 录</button>
                </form>
                <div class="login-footer">
                    还没有账号？<a th:href="@{/register}">立即注册</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function doLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            if (!username || !password) {
                alert('请填写完整');
                return false;
            }
            fetch('/api/user/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({ username, password })
            })
            .then(r => r.json())
            .then(res => {
                if (res.code === 200) {
                    // 登录成功，跳转到首页或之前请求的页面
                    const redirect = new URLSearchParams(location.search).get('redirect') || '/';
                    location.href = redirect;
                } else {
                    alert(res.message || '登录失败');
                }
            })
            .catch(err => alert('网络错误：' + err));
            return false;
        }
    </script>
</body>
</html>
